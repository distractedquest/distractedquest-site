name: YouTube pull

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (UTC), off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # The pull script has no npm dependencies, so no install step is needed.
      - name: Merge new uploads into src/data/videos.json
        run: node scripts/youtube-pull.mjs
      - name: Build check (only when videos changed)
        id: diff
        run: |
          if git diff --quiet -- src/data/videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: npm ci && npm run build
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "distractedquest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git commit -m "chore(videos): pull new YouTube uploads"
          git push
          # The push triggers Cloudflare Workers Builds, which redeploys the site.
